<head>

<body class="bg-light">
<div class="container-fluid py-4">
    <h2 class="mb-4 fw-bold">선박 입출항 조회 시스템</h2>

    <!-- 조회 폼 -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-bold">항만청</label>

                        <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start"

                                data-bs-toggle="dropdown" data-bs-auto-close="outside"

                <div class="col-md-3">
                    <label class="form-label fw-bold">조회 시작일</label>
                    <input type="date" id="start-date" class="form-control">

                <div class="col-md-3">
                    <label class="form-label fw-bold">조회 종료일</label>

        <!-- 필터 + 다운로드 -->

                    <div class="col-md-2">
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start"
                                    type="button" id="vtype-btn"

                                <div id="vtype-checks"></div>

                    <div class="col-md-2">

                                전체 화물종류

                                 style="min-width:220px;max-height:300px;overflow-y:auto;">
                                <div class="d-flex gap-2 mb-2">
                                    <button type="button"
                                            class="btn btn-sm btn-outline-primary flex-fill"
                                            onclick="selectAllCb('cargo-cb')">전체 선택</button>
                                    <button type="button"
                                            class="btn btn-sm btn-outline-secondary flex-fill"
                                            onclick="clearAllCb('cargo-cb')">전체 해제</button>
                                </div>
                                <hr class="my-1">

                    </div>
                    <div class="col-md-2">
                        <div class="dropdown">

                                    type="button" id="nat-btn"
                                    data-bs-toggle="dropdown" data-bs-auto-close="outside">
                                전체 국적

                                <div class="d-flex gap-2 mb-2">

                                            class="btn btn-sm btn-outline-primary flex-fill"

                                    <button type="button"

                                            onclick="clearAllCb('nat-cb')">전체 해제</button>

                                onclick="resetFilters()">초기화</button>
                    </div>
                    <div class="col-md-2">

        <!-- 테이블 -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-sm mb-0">
                        <thead class="table-dark" id="table-head"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center
                        flex-wrap gap-2">
                <span id="page-info" class="text-muted small"></span>
                <nav aria-label="pagination">
                    <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
                </nav>
            </div>
        </div>

</div>

<script>
/* ── 상수 ─────────────────────────────────────────────── */
const COLUMNS = [
    ["date",               "날짜"],
    ["entry_exit",         "입출항"],
    ["de_raw_entry_dt",    "입항일시"],
    ["de_raw_depart_dt",   "출항일시"],
    ["port_name",          "항만명"],
    ["vessel_name",        "선박명"],
    ["vessel_type",        "선박종류"],
    ["vessel_nationality", "국적"],
    ["entry_purpose",      "입항목적"],
    ["berth_name",         "계류시설"],
    ["in_out",             "내외항"],
    ["tug_used",           "예선"],
    ["pilot_used",         "도선"],
    ["cargo_type_name",    "화물종류"],
    ["ld_ton",             "선적톤수"],
    ["landng_ton",         "양하톤수"],
    ["trnpdt_ton",         "환적톤수"],
    ["grtg",               "총톤수"],
    ["declarer",           "신고인"],
];
const PAGE_SIZE    = 100;
const NUMERIC_COLS = new Set(["ld_ton", "landng_ton", "trnpdt_ton", "grtg"]);
const DATETIME_COLS = new Set(["de_raw_entry_dt", "de_raw_depart_dt"]);
const NOWRAP_COLS  = new Set(["date", "vessel_name", "de_raw_entry_dt", "de_raw_depart_dt"]);

/* ── 상태 ─────────────────────────────────────────────── */
let allRecords      = [];
let filteredRecords = [];
let currentPage     = 1;
let currentParams   = {};
let sortKey         = "date";
let sortDir         = "asc";

/* ── HTML 이스케이프 ───────────────────────────────────── */
function esc(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
                          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtDatetime(val) {
    if (!val) return "";
    // "2025-08-01T17:00:00+09:00" → "17:00"
    const m = String(val).match(/T(\d{2}:\d{2})/);
    return m ? m[1] : String(val);
}

function fmtCell(key, val) {
    if (NUMERIC_COLS.has(key)) {
        const n = parseFloat(val);
        if (!isNaN(n)) return n.toLocaleString("ko-KR");
        return "";
    }
    if (DATETIME_COLS.has(key)) return fmtDatetime(val);
    return esc(val);
}

/* ── 항만 목록 [청코드, 무역항명, 세부구역] ───────────── */
const PORT_LIST = [
    ["20",  "부산항",      "부산, 감천, 신항"],
    ["30",  "인천항",      "인천"],
    ["50",  "경인항",      "경인"],
    ["31",  "평택·당진항", "평택"],
    ["200", "동해·묵호항", "동해"],
    ["202", "동해·묵호항", "묵호"],
    ["300", "대산항",      "대산"],
    ["303", "대산항",      "당진(화력)"],
    ["304", "대산항",      "보령해양수산출장소"],
    ["500", "군산항",      "군산"],
    ["501", "장항항",      "장항"],
    ["610", "목포항",      "목포"],
    ["616", "목포항",      "대불분실"],
    ["617", "여수항",      "북항분실, 여수"],
    ["620", "광양항",      "여수"],
    ["621", "광양항",      "여천"],
    ["622", "광양항",      "광양"],
    ["700", "포항항",      "포항"],
    ["701", "포항항",      "신항"],
    ["702", "포항항",      "영일만"],
    ["810", "마산항",      "마산"],
    ["820", "울산항",      "울산"],
];

/* ── 항만 체크박스 초기화 (무역항별 그룹) ────────────── */
(function initPortChecks() {
    const container = document.getElementById("port-checks");

    // 무역항명 기준으로 그룹화 (순서 유지)
    const groups = [];
    const seen   = {};
    PORT_LIST.forEach(([code, name, region]) => {
        if (!seen[name]) { seen[name] = []; groups.push([name, seen[name]]); }
        seen[name].push([code, region]);
    });

    groups.forEach(([name, entries]) => {
        const wrap = document.createElement("div");
        wrap.className = "mb-1";

        if (entries.length === 1) {
            const [code, region] = entries[0];
            wrap.innerHTML =
                `<div class="form-check">` +
                `<input class="form-check-input port-cb" type="checkbox" value="${code}"
                        id="port-${code}" onchange="updatePortBtnLabel()">` +
                `<label class="form-check-label small" for="port-${code}">` +
                `${name}, ${code}, ${region}</label></div>`;
        } else {
            const gid = `grp-${name}`;
            wrap.innerHTML =
                `<div class="form-check">` +
                `<input class="form-check-input" type="checkbox" id="${gid}"
                        onchange="toggleGroup('${name}', this.checked)">` +
                `<label class="form-check-label small fw-semibold" for="${gid}">${name}</label></div>`;
            entries.forEach(([code, region]) => {
                const child = document.createElement("div");
                child.className = "form-check ms-3";
                child.innerHTML =
                    `<input class="form-check-input port-cb" type="checkbox" value="${code}"
                            id="port-${code}" data-group="${name}"
                            onchange="syncGroupHeader('${name}'); updatePortBtnLabel()">` +
                    `<label class="form-check-label small" for="port-${code}">` +
                    `${name}, ${code}, ${region}</label>`;
                wrap.appendChild(child);
            });
        }
        container.appendChild(wrap);
    });
})();

function toggleGroup(name, checked) {
    document.querySelectorAll(`.port-cb[data-group="${name}"]`)
        .forEach(cb => cb.checked = checked);
    updatePortBtnLabel();
}

function syncGroupHeader(name) {
    const children = [...document.querySelectorAll(`.port-cb[data-group="${name}"]`)];
    const hdr = document.getElementById(`grp-${name}`);
    if (!hdr) return;
    const checkedCount = children.filter(cb => cb.checked).length;
    hdr.checked       = checkedCount === children.length;
    hdr.indeterminate = checkedCount > 0 && checkedCount < children.length;
}

/* ── 항만코드 UI ──────────────────────────────────────── */
function selectAllPorts() {
    document.querySelectorAll(".port-cb").forEach(cb => cb.checked = true);
    document.querySelectorAll("[id^='grp-']").forEach(hdr => {
        hdr.checked = true; hdr.indeterminate = false;
    });
    updatePortBtnLabel();
}

function clearAllPorts() {
    document.querySelectorAll(".port-cb").forEach(cb => cb.checked = false);
    document.querySelectorAll("[id^='grp-']").forEach(hdr => {
        hdr.checked = false; hdr.indeterminate = false;
    });
    document.getElementById("port-custom").value = "";
    updatePortBtnLabel();
}

function updatePortBtnLabel() {
    const checked = [...document.querySelectorAll(".port-cb:checked")];
    const custom  = (document.getElementById("port-custom").value || "")
        .split(",").map(s => s.trim()).filter(Boolean);
    const total = checked.length + custom.length;
    const btn = document.getElementById("port-btn");
    if (total === 0) {
        btn.textContent = "항만 선택";
    } else if (total === 1) {
        const code = checked.length ? checked[0].value : custom[0];
        const entry = PORT_LIST.find(([c]) => c === code);
        btn.textContent = entry ? `${entry[1]}, ${code}, ${entry[2]}` : code;
    } else {
        btn.textContent = `${total}개 항만 선택`;
    }
}

function getPortCodes() {
    const checked = [...document.querySelectorAll(".port-cb:checked")].map(cb => cb.value);
    const custom  = (document.getElementById("port-custom").value || "")
        .split(",").map(s => s.trim()).filter(Boolean);
    return [...new Set([...checked, ...custom])];
}

/* ── 조회 ─────────────────────────────────────────────── */
async function runQuery() {
    const codes     = getPortCodes();
    const startDate = document.getElementById("start-date").value.replace(/-/g, "");
    const endDate   = document.getElementById("end-date").value.replace(/-/g, "");

    if (!codes.length || !startDate || !endDate) {
        showError("항만 1개 이상, 시작일, 종료일을 모두 입력해주세요.");
        return;
    }
    if (startDate > endDate) {
        showError("시작일이 종료일보다 늦을 수 없습니다.");
        return;
    }

    currentParams = { prtAgCd: codes, start_date: startDate, end_date: endDate };
    showError("");
    showProgress(0);
    document.getElementById("results-section").style.display = "none";
    document.getElementById("query-btn").disabled = true;

    const params = new URLSearchParams();
    codes.forEach(c => params.append("prtAgCd", c));
    params.set("start_date", startDate);
    params.set("end_date", endDate);

    const es = new EventSource(`/query-stream?${params.toString()}`);

    es.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.error) {
            es.close();
            showError(msg.error);
            showProgress(null);
            document.getElementById("query-btn").disabled = false;
        } else if (msg.records !== undefined) {
            es.close();
            allRecords = msg.records;
            renderAll();
            document.getElementById("results-section").style.display = "block";
            showProgress(null);
            document.getElementById("query-btn").disabled = false;
        } else {
            showProgress(msg.progress);
        }
    };

    es.onerror = () => {
        es.close();
        showError("데이터 조회 중 오류가 발생했습니다.");
        showProgress(null);
        document.getElementById("query-btn").disabled = false;
    };
}

/* ── 렌더링 ───────────────────────────────────────────── */
function renderAll() {
    renderSummary(allRecords);
    populateFilterDropdowns(allRecords);
    resetFilters();
}

function renderSummary(records) {
    const arrivals   = records.filter(r => r.entry_exit === "입항").length;
    const departures = records.filter(r => r.entry_exit === "출항").length;
    const vtypes     = new Set(records.map(r => r.vessel_type).filter(Boolean)).size;
    const sumTon = key =>
        records.reduce((s, r) => s + (parseFloat(r[key]) || 0), 0)
               .toLocaleString("ko-KR", { maximumFractionDigits: 0 });

    const cards = [
        ["총 레코드",    records.length.toLocaleString("ko-KR"), "primary",   "0d6efd"],
        ["입항",         arrivals.toLocaleString("ko-KR"),        "success",   "198754"],
        ["출항",         departures.toLocaleString("ko-KR"),      "warning",   "ffc107"],
        ["선박 종류 수", vtypes.toLocaleString("ko-KR"),          "info",      "0dcaf0"],
        ["선적톤 합계",  sumTon("ld_ton"),                         "secondary", "6c757d"],
        ["양하톤 합계",  sumTon("landng_ton"),                     "secondary", "6c757d"],
        ["환적톤 합계",  sumTon("trnpdt_ton"),                     "secondary", "6c757d"],
    ];

    document.getElementById("summary-cards").innerHTML = cards.map(
        ([label, value, cls, hex]) => `
        <div class="col-xl-3 col-md-4 col-6">
            <div class="card summary-card shadow-sm h-100"
                 style="border-left-color:#${hex}">
                <div class="card-body py-2">
                    <div class="text-muted small">${label}</div>
                    <div class="fs-5 fw-bold text-${cls}">${value}</div>
                </div>
            </div>
        </div>`
    ).join("");
}

/* ── 필터 체크박스 드롭다운 공통 설정 ─────────────────── */
const CB_CONFIG = {
    "vtype-cb": { btnId: "vtype-btn", allLabel: "전체 선박종류" },
    "cargo-cb": { btnId: "cargo-btn", allLabel: "전체 화물종류" },
    "nat-cb":   { btnId: "nat-btn",   allLabel: "전체 국적"     },
};

function buildCbDropdown(containerId, cbClass, values) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    values.forEach(val => {
        const safeId = `${cbClass}-${val.replace(/[^a-z0-9]/gi, "_")}`;
        const div = document.createElement("div");
        div.className = "form-check";
        div.innerHTML =
            `<input class="form-check-input ${cbClass}" type="checkbox" value="${esc(val)}"
                    id="${safeId}" checked onchange="onCbChange('${cbClass}')">` +
            `<label class="form-check-label small" for="${safeId}">${esc(val)}</label>`;
        container.appendChild(div);
    });
    refreshCbBtn(cbClass);
}

function onCbChange(cbClass) { refreshCbBtn(cbClass); applyFilters(); }

function refreshCbBtn(cbClass) {
    const { btnId, allLabel } = CB_CONFIG[cbClass];
    const all     = document.querySelectorAll(`.${cbClass}`);
    const checked = document.querySelectorAll(`.${cbClass}:checked`);
    const btn = document.getElementById(btnId);
    if (all.length === 0 || checked.length === all.length) btn.textContent = allLabel;
    else if (checked.length === 0)                          btn.textContent = "선택";
    else if (checked.length === 1)                          btn.textContent = checked[0].value;
    else                                                    btn.textContent = `${checked.length}개 선택`;
}

function selectAllCb(cbClass) {
    document.querySelectorAll(`.${cbClass}`).forEach(cb => cb.checked = true);
    refreshCbBtn(cbClass); applyFilters();
}

function clearAllCb(cbClass) {
    document.querySelectorAll(`.${cbClass}`).forEach(cb => cb.checked = false);
    refreshCbBtn(cbClass); applyFilters();
}

function getCbSelected(cbClass) {
    const all     = [...document.querySelectorAll(`.${cbClass}`)];
    const checked = all.filter(cb => cb.checked);
    if (all.length === 0 || checked.length === all.length) return null;
    return new Set(checked.map(cb => cb.value));
}

/* ── 필터 드롭다운 자동 구성 ──────────────────────────── */
function populateFilterDropdowns(records) {
    const vtypes = [...new Set(records.map(r => r.vessel_type).filter(Boolean))].sort();
    const ctypes = [...new Set(records.map(r => r.cargo_type_name).filter(Boolean))].sort();
    const nats   = [...new Set(records.map(r => r.vessel_nationality).filter(Boolean))].sort();

    buildCbDropdown("vtype-checks", "vtype-cb", vtypes);
    buildCbDropdown("cargo-checks", "cargo-cb", ctypes);
    buildCbDropdown("nat-checks",   "nat-cb",   nats);
}

/* ── 필터 적용 ────────────────────────────────────────── */
function applyFilters() {
    const nameTerms = document.getElementById("filter-vessel-name").value
        .split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
    const vtypes = getCbSelected("vtype-cb");
    const cargos = getCbSelected("cargo-cb");
    const nats   = getCbSelected("nat-cb");

    filteredRecords = allRecords.filter(r => {
        if (nameTerms.length > 0) {
            const vn = (r.vessel_name || "").toLowerCase();
            if (!nameTerms.some(t => vn.includes(t))) return false;
        }
        if (vtypes && !vtypes.has(r.vessel_type      || "")) return false;
        if (cargos && !cargos.has(r.cargo_type_name  || "")) return false;
        if (nats   && !nats.has(r.vessel_nationality || ""))  return false;
        return true;
    });

    sortRecords();
    currentPage = 1;
    renderTable();
}

function resetFilters() {
    document.getElementById("filter-vessel-name").value = "";
    Object.keys(CB_CONFIG).forEach(cls => {
        document.querySelectorAll(`.${cls}`).forEach(cb => cb.checked = true);
        refreshCbBtn(cls);
    });
    applyFilters();
}

/* ── 정렬 ─────────────────────────────────────────────── */
function setSort(key) {
    if (sortKey === key) {
        sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
        sortKey = key;
        sortDir = "asc";
    }
    sortRecords();
    currentPage = 1;
    renderTable();
}

function sortRecords() {
    filteredRecords.sort((a, b) => {
        let va = a[sortKey] ?? "";
        let vb = b[sortKey] ?? "";
        if (NUMERIC_COLS.has(sortKey)) {
            va = parseFloat(va) || 0;
            vb = parseFloat(vb) || 0;
        } else {
            va = String(va);
            vb = String(vb);
        }
        if (va < vb) return sortDir === "asc" ? -1 : 1;
        if (va > vb) return sortDir === "asc" ?  1 : -1;
        return 0;
    });
}

/* ── 테이블 + 페이지네이션 ────────────────────────────── */
function renderTable() {
    const total      = filteredRecords.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const start      = (currentPage - 1) * PAGE_SIZE;
    const pageRecs   = filteredRecords.slice(start, start + PAGE_SIZE);

    document.getElementById("table-head").innerHTML =
        `<tr>${COLUMNS.map(([key, label]) => {
            const cls = key === sortKey ? ` sort-${sortDir}` : "";
            return `<th class="text-nowrap${cls}" onclick="setSort('${key}')">${label}</th>`;
        }).join("")}</tr>`;

    document.getElementById("table-body").innerHTML = pageRecs.length
        ? pageRecs.map(r =>
            `<tr>${COLUMNS.map(([key]) =>
                `<td${NOWRAP_COLS.has(key) ? ' class="text-nowrap"' : ''}>${fmtCell(key, r[key])}</td>`
            ).join("")}</tr>`
          ).join("")
        : `<tr><td colspan="${COLUMNS.length}" class="text-center text-muted py-4">
               조회 결과가 없습니다.
           </td></tr>`;

    document.getElementById("page-info").textContent =
        `총 ${total.toLocaleString("ko-KR")}건 / ${totalPages}페이지`;

    renderPagination(totalPages);
}

function renderPagination(totalPages) {
    const MAX_BTNS = 10;
    const half     = Math.floor(MAX_BTNS / 2);
    let   pStart   = Math.max(1, currentPage - half);
    let   pEnd     = Math.min(totalPages, pStart + MAX_BTNS - 1);
    if (pEnd - pStart < MAX_BTNS - 1) pStart = Math.max(1, pEnd - MAX_BTNS + 1);

    const items = [];
    items.push(li(currentPage === 1, "«", currentPage - 1));
    for (let p = pStart; p <= pEnd; p++)
        items.push(li(false, p, p, p === currentPage));
    items.push(li(currentPage === totalPages, "»", currentPage + 1));

    document.getElementById("pagination").innerHTML = items.join("");
}

function li(disabled, label, page, active = false) {
    return `<li class="page-item${disabled ? " disabled" : ""}${active ? " active" : ""}">
        <a class="page-link" onclick="goPage(${page})">${label}</a></li>`;
}

function goPage(p) {
    const totalPages = Math.ceil(filteredRecords.length / PAGE_SIZE);
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderTable();
    document.getElementById("results-section").scrollIntoView({ behavior: "smooth" });
}

/* ── XLSX 다운로드 ────────────────────────────────────── */
function downloadXlsx() {
    if (!currentParams.prtAgCd || !currentParams.prtAgCd.length) {
        showError("먼저 조회를 실행해주세요.");
        return;
    }
    const { prtAgCd, start_date, end_date } = currentParams;
    const params = new URLSearchParams();
    prtAgCd.forEach(c => params.append("prtAgCd", c));
    params.set("start_date", start_date);
    params.set("end_date", end_date);
    window.location.href = `/export?${params.toString()}`;
}

/* ── 유틸 ─────────────────────────────────────────────── */
function showProgress(pct) {
    const el = document.getElementById("loading-msg");
    if (pct === null) { el.style.display = "none"; return; }
    el.style.display = "block";
    document.getElementById("loading-text").textContent = `데이터 조회 중... ${pct}%`;
}

function showError(msg) {
    const el = document.getElementById("error-msg");
    el.textContent = msg;
    el.style.display = msg ? "block" : "none";
}
</script>
